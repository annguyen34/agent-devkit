name: CI

on:
  push:
    branches: [main, dev/**]
    paths:
      - 'src/**'
      - 'templates/**'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'jest.config.ts'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'templates/**'
      - 'tsconfig.json'
      - 'tsconfig.build.json'
      - 'jest.config.ts'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Run tests
        run: npm test -- --ci
